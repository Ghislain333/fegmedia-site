<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEGMEDIA - Connexion Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 5rem auto;
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            border-top: 4px solid var(--primary-color);
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #121212;
            color: #fff;
            font-size: 1rem;
        }
        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #1e40cf;
        }
        #alert-msg {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">FEG<span>MEDIA</span></a>
    </header>

    <main class="container">
        <div class="login-box">
            <h2 style="font-family: 'Anton'; margin-bottom: 1.5rem; text-align: center;">Espace Administration</h2>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" required placeholder="admin@fegmedia.com">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Se connecter</button>
            </form>

            <div id="alert-msg"></div>
        </div>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertMsg = document.getElementById('alert-msg');
            
            alertMsg.style.color = '#fff';
            alertMsg.textContent = 'Connexion en cours...';

            try {
                const response = await fetch('../login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();

                if (data.status === 'success') {
                    alertMsg.style.color = '#22c55e';
                    alertMsg.textContent = 'Connexion réussie ! Redirection...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.php';
                    }, 1000);
                } else {
                    alertMsg.style.color = '#ef4444';
                    alertMsg.textContent = data.message;
                }
            } catch (err) {
                alertMsg.style.color = '#ef4444';
                alertMsg.textContent = 'Erreur de connexion au serveur.';
            }
        });
    </script>

</body>
</html>
